[project]
name = "gemelo"
version = "0.1.0"
description = "Gemelo: orquestador, gateway y carriles de defensa para agentes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sse-starlette",
    "sqlalchemy",
    "docker",
    "e2b",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gemelo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
