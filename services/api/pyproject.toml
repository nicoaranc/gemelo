[project]
name = "gemelo-api"
version = "0.1.0"
description = "Orquestador de Gemelo: corre un ataque en cuatro carriles y entrega el diff del gemelo alto"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "docker>=7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gemelo*"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = [
  "docker: requiere Docker y la imagen del sandbox",
]
